<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaking Coach — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef1e9;
      --surface: #ffffff;
      --ink: #0d2b21;
      --ink-soft: #3c5148;
      --muted: #7e9088;
      --accent: #0e6e44;
      --accent-bright: #14a868;
      --line: #dee4da;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Public Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 18% 8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 45%),
                         radial-gradient(circle at 85% 92%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 40%);
    }

    .panel {
      width: min(420px, calc(100vw - 48px));
      background: var(--surface);
      border-radius: 28px;
      padding: 44px 40px 36px;
      box-shadow: 0 24px 60px -24px color-mix(in srgb, var(--ink) 35%, transparent);
    }

    .mark {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--ink); color: var(--bg);
      display: grid; place-items: center;
      margin-bottom: 22px;
    }
    .mark svg { width: 18px; height: 18px; }

    h1 {
      font-family: var(--serif); font-weight: 600; font-size: 30px;
      line-height: 1.15; letter-spacing: -0.01em; margin: 0 0 8px;
    }
    p.lede {
      margin: 0 0 30px; color: var(--ink-soft); font-size: 14px; line-height: 1.6;
      max-width: 34ch;
    }

    form { display: flex; flex-direction: column; gap: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field label {
      display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); font-weight: 600; margin-bottom: 7px;
    }
    .field input {
      width: 100%; padding: 12px 14px; font: inherit; font-size: 15px;
      color: var(--ink); background: var(--bg);
      border: 1.5px solid var(--line); border-radius: 12px;
      outline: none; transition: border-color 150ms ease, background 150ms ease;
    }
    .field input:focus { border-color: var(--accent); background: var(--surface); }
    .field input::placeholder { color: var(--muted); }

    .go {
      margin-top: 6px;
      width: 100%; border: none; cursor: pointer;
      background: var(--accent); color: #f2fbf6;
      font-family: var(--sans); font-weight: 700; font-size: 14.5px;
      padding: 15px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 150ms ease, transform 150ms ease;
    }
    .go:hover { background: var(--accent-bright); transform: translateY(-1px); }
    .go:active { transform: translateY(0); }
    .go .arrow {
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: grid; place-items: center; font-size: 11px;
    }

    .error {
      font-size: 13px; color: #b23b2e; min-height: 16px; margin: -6px 0 0;
    }

    .resume {
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);
      display: none; align-items: center; justify-content: space-between; gap: 12px;
    }
    .resume.show { display: flex; }
    .resume-info { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
    .resume-info strong { color: var(--ink); font-family: var(--serif); font-size: 15px; }
    .resume-btn {
      flex: none; background: transparent; border: 1.5px solid var(--line);
      color: var(--ink); font-family: var(--sans); font-size: 12.5px; font-weight: 600;
      padding: 9px 16px; border-radius: 999px; cursor: pointer;
      transition: border-color 150ms ease, color 150ms ease;
    }
    .resume-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="panel">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" fill="currentColor"/>
        <path d="M6 11a1 1 0 1 0-2 0 8 8 0 0 0 7 7.94V21H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.06A8 8 0 0 0 20 11a1 1 0 1 0-2 0 6 6 0 0 1-12 0Z" fill="currentColor"/>
      </svg>
    </div>
    <h1>Before we begin</h1>
    <p class="lede">Enter your details so your recordings and progress are saved under your own name.</p>

    <form id="gateForm" novalidate>
      <div class="field">
        <label for="fName">Full Name</label>
        <input id="fName" placeholder="e.g. Ali Raza" autocomplete="name">
      </div>
      <div class="row">
        <div class="field">
          <label for="fRoll">Roll Number</label>
          <input id="fRoll" placeholder="e.g. 24-B-091">
        </div>
        <div class="field">
          <label for="fGrade">Grade</label>
          <input id="fGrade" placeholder="e.g. Grade 7">
        </div>
      </div>
      <div class="field">
        <label for="fSection">Section</label>
        <input id="fSection" placeholder="e.g. Section A">
      </div>
      <div class="error" id="formError"></div>
      <button class="go" type="submit">
        Enter Dashboard
        <span class="arrow">→</span>
      </button>
    </form>

    <div class="resume" id="resume">
      <div class="resume-info">Signed in earlier as<br><strong id="resumeName"></strong></div>
      <button class="resume-btn" id="resumeBtn">Continue</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'speakingCoachStudent';

    const form = document.getElementById('gateForm');
    const errorEl = document.getElementById('formError');
    const resume = document.getElementById('resume');
    const resumeName = document.getElementById('resumeName');
    const resumeBtn = document.getElementById('resumeBtn');

    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }

    if (saved && saved.name && saved.roll) {
      resume.classList.add('show');
      resumeName.textContent = `${saved.name} · Roll ${saved.roll}`;
      resumeBtn.addEventListener('click', () => { window.location.href = 'dashboard.html'; });
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('fName').value.trim();
      const roll = document.getElementById('fRoll').value.trim();
      const grade = document.getElementById('fGrade').value.trim();
      const section = document.getElementById('fSection').value.trim();

      if (!name || !roll || !grade || !section) {
        errorEl.textContent = 'Please fill in every field to continue.';
        return;
      }
      errorEl.textContent = '';

      localStorage.setItem(STORAGE_KEY, JSON.stringify({ name, roll, grade, section }));
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
